<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FociEredmények.hu – Élő futball app</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: linear-gradient(160deg, #0b3d2e 0%, #062018 100%); min-height: 100vh; color: white; }

  /* ===== FEJLÉC ===== */
  header { background: rgba(13,79,56,0.95); padding: 18px 20px; text-align: center;
           box-shadow: 0 4px 20px rgba(0,0,0,0.4); position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 32px; letter-spacing: 1px; }
  header h1 span { color: #ffcc00; }
  .alcim { color: #9fd4b8; font-size: 13px; margin-top: 4px; }
  .live-badge { display: inline-block; background: #e63946; color: white; padding: 5px 16px;
                border-radius: 20px; font-size: 13px; font-weight: bold; margin-top: 10px; }
  .live-badge::before { content: "● "; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }

  /* ===== NAVIGÁCIÓ / LIGA FÜLEK ===== */
  nav { display: flex; justify-content: center; gap: 10px; padding: 15px; flex-wrap: wrap; }
  nav button { background: rgba(255,255,255,0.1); color: white; border: 2px solid #1a6b4a;
               padding: 10px 22px; border-radius: 30px; cursor: pointer; font-size: 15px;
               font-weight: bold; transition: all 0.25s; }
  nav button:hover { background: #1a6b4a; transform: translateY(-2px); }
  nav button.aktiv { background: #ffcc00; color: #0b3d2e; border-color: #ffcc00; }

  /* ===== KERESŐ ===== */
  .kereso-wrap { text-align: center; padding: 5px 20px 15px; }
  .kereso { width: 100%; max-width: 420px; padding: 12px 20px; border-radius: 30px; border: none;
            font-size: 15px; outline: none; background: rgba(255,255,255,0.95); }

  /* ===== TARTALOM ===== */
  main { max-width: 950px; margin: 0 auto; padding: 10px 15px 60px; }

  .statisztika { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                 gap: 12px; margin-bottom: 25px; }
  .stat-kartya { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
                 border-radius: 12px; padding: 16px; text-align: center; backdrop-filter: blur(6px); }
  .stat-kartya .szam { font-size: 30px; font-weight: bold; color: #ffcc00; }
  .stat-kartya .felirat { font-size: 12px; color: #9fd4b8; margin-top: 4px; }

  .league { background: white; color: #222; border-radius: 14px; margin-bottom: 25px;
            overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.35); }
  .league-header { background: linear-gradient(90deg, #1a6b4a, #0d4f38); color: white;
                   padding: 14px 20px; font-size: 18px; font-weight: bold;
                   display: flex; justify-content: space-between; align-items: center; }
  .league-header .darab { font-size: 12px; background: rgba(255,255,255,0.2);
                          padding: 3px 10px; border-radius: 12px; }

  .match { display: grid; grid-template-columns: 1fr 90px 1fr 80px;
           align-items: center; padding: 13px 20px; border-bottom: 1px solid #eef2ef;
           transition: background 0.15s; }
  .match:last-child { border-bottom: none; }
  .match:hover { background: #f0f8f3; }
  .match.elo { background: #fff5f5; border-left: 4px solid #e63946; }
  .home, .away { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .home { text-align: right; justify-content: flex-end; }
  .away { text-align: left; }
  .jel { width: 26px; height: 26px; border-radius: 50%; color: white; font-size: 11px;
         font-weight: bold; display: flex; align-items: center; justify-content: center;
         flex-shrink: 0; }
  .score { background: #0d4f38; color: white; padding: 7px 12px; border-radius: 8px;
           text-align: center; font-weight: bold; font-size: 15px; }
  .match.elo .score { background: #e63946; animation: pulz 1.5s infinite; }
  @keyframes pulz { 50% { transform: scale(1.06); } }
  .status { text-align: center; font-size: 11px; color: #888; }
  .status.live { color: #e63946; font-weight: bold; }

  .demo-jelzes { background: #fff3cd; color: #856404; padding: 10px 20px; font-size: 13px;
                 text-align: center; margin-bottom: 15px; border-radius: 10px; }

  .loading, .error { text-align: center; padding: 50px; font-size: 18px; }
  .spinner { display: inline-block; width: 44px; height: 44px; border: 5px solid rgba(255,255,255,0.2);
             border-top-color: #ffcc00; border-radius: 50%; animation: forog 0.9s linear infinite; }
  @keyframes forog { to { transform: rotate(360deg); } }

  .updated { text-align: center; color: #9fd4b8; font-size: 12px; padding: 15px; }

  /* ===== TABLA (rendezés) ===== */
  table { width: 100%; border-collapse: collapse; }
  th { background: #0d4f38; color: white; padding: 10px; font-size: 12px; }
  td { padding: 10px; text-align: center; border-bottom: 1px solid #eee; font-size: 14px; }
  td.csapat { text-align: left; font-weight: 600; }

  footer { text-align: center; padding: 25px; color: #6fa88c; font-size: 13px;
           border-top: 1px solid rgba(255,255,255,0.1); }

  @media (max-width: 600px) {
    .match { grid-template-columns: 1fr 70px 1fr; font-size: 13px; }
    .status { display: none; }
    header h1 { font-size: 24px; }
  }
</style>
</head>
